name: Release

# Publishes the IPS patch as a GitHub release (tag from TAG below, created by GitHub).
# Runs when the patch changes on the development branch or the default branch,
# or by hand.  If the release exists, its patch file is replaced.
on:
  push:
    branches:
      - main
      - master
      - claude/rc-pro-am-multiplayer-patch-tfj3dm
    paths:
      - rcproam_2p.ips
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: v1.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rcproam_2p.ips --clobber
          else
            gh release create "$TAG" rcproam_2p.ips \
              --target "$GITHUB_SHA" \
              --title "R.C. Pro-Am 2 Player $TAG" \
              --notes-file .github/release-notes.md
          fi
