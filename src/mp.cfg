MEMORY {
    WRAM:   start = $6000, size = $1C00, fill = yes, fillval = $00, file = "%O";
    VARS:   start = $7C00, size = $0400, fill = yes, fillval = $00, file = "%O";
    FIX:    start = $F8D1, size = 47,    fill = no, file = "loader.bin";
}
SEGMENTS {
    CODE:   load = WRAM, type = ro;
    BSS:    load = VARS, type = bss, define = yes;
    LOADER: load = FIX,  type = ro;
}
